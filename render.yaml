services:
  - type: web
    name: recording-pipeline-api
    runtime: node
    plan: free
    buildCommand: npm install && npx turbo build --filter=server
    startCommand: node apps/server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recording-db
          property: connectionString
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false # Set this to your Vercel URL after deploying frontend

databases:
  - name: recording-db
    plan: free
